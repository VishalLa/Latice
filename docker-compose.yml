services:
  postgres_db:
    image: postgres:15-alpine
    container_name: bank_rec_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_reconciliation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network

  redis_server:
    image: redis:7-alpine
    container_name: bank_rec_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend_network

  backend:
    build: .
    container_name: bank_rec_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis_server:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres_db:5432/bank_reconciliation
      POSTGRES_HOST: postgres_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_reconciliation
    depends_on:
      - postgres_db
      - redis_server
    networks:
      - backend_network

  worker:
    build: .
    container_name: bank_rec_worker
    command: celery -A app.celery worker --loglevel=info
    environment:
      REDIS_URL: redis://redis_server:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres_db:5432/bank_reconciliation
      POSTGRES_HOST: postgres_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_reconciliation
    depends_on:
      - postgres_db
      - redis_server
    networks:
      - backend_network

volumes:
  postgres_data:

networks:
  backend_network:
    driver: bridge

