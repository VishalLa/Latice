version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: bank_rec_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_reconciliation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network

  redis_server:
    image: redis:7-alpine
    container_name: bank_rec_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend_network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_storage:/root/.ollama
    restart: always
    networks:
      - backend_network

  backend:
    build: .
    container_name: bank_rec_backend
    ports:
      - "8000:8000"
    volumes:
      - shared_uploads:/app/uploads
    environment:
      REDIS_URL: redis://redis_server:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres_db:5432/bank_reconciliation
      POSTGRES_HOST: postgres_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_reconciliation
      OLLAMA_URL: http://ollama:11434
      OLLAMA_NAME: phi3:latest
    depends_on:
      - postgres_db
      - redis_server
      - ollama
    networks:
      - backend_network

  worker:
    build: .
    container_name: bank_rec_worker
    command: celery -A app.celery worker --loglevel=info
    environment:
      REDIS_URL: redis://redis_server:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres_db:5432/bank_reconciliation
      POSTGRES_HOST: postgres_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_reconciliation
      OLLAMA_URL: http://ollama:11434
      OLLAMA_NAME: phi3:latest
    volumes:
      - shared_uploads:/app/uploads
    depends_on:
      - postgres_db
      - redis_server
      - ollama
    networks:
      - backend_network

volumes:
  postgres_data:
  ollama_storage:
  shared_uploads:

networks:
  backend_network:
    driver: bridge
    